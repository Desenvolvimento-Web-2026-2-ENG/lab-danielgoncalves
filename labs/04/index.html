<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abrir Chamado Técnico</title>
</head>
<body>
    <main>
        <form action="https://httpbin.org/post" method="POST" enctype="multipart/form-data">
            <fieldset>
                <legend>Abrir Chamado Técnico</legend>

                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome" autocomplete="name" required>

                <label for="email">E-mail de Contato:</label>
                <input type="email" id="email" name="email" autocomplete="email" required>

                <label for="prioridade">Prioridade:</label>
                <select id="prioridade" name="prioridade" required>
                    <option value="">Selecione uma prioridade</option>
                    <option value="baixa">Baixa</option>
                    <option value="media">Média</option>
                    <option value="alta">Alta</option>
                </select>

                <label for="anexo">Arquivo de Log ou Print (PNG/PDF):</label>
                <input type="file" id="anexo" name="anexo" accept="image/png,application/pdf" required aria-describedby="anexo-ajuda">
                <p id="anexo-ajuda">Anexe apenas arquivos nos formatos PNG ou PDF.</p>

                <button type="submit">Enviar Chamado</button>
            </fieldset>
        </form>
    </main>
</body>
</html>
