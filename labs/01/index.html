<!DOCTYPE html>

<head>

<body>
  <header> 
        <h1> Cabeçalho da pagiana </h1>
        <nav> 
             <a href="#">Ajuda</a> | <a href="#">Sair</a>
        </nav>
 </header>
 <main>
     <article> 
   <h2> Envie uma mensagem </h2> 
        <form action="/enviar" method="POST">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required  minlength="3">
        <br><br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required><br><br>


            <label for="celular">Telefone Celular:</label> 
            <input type="tel" id="celular" name="celular" required pattern="[0-9]{11}" ><br><br>


            <label for="msg">Mensagem:</label>
            <textarea id="msg" name="msg" required></textarea><br><br>
           
            
            <input type="submit" value="Disparar Dados">
        </form>
       </article>
    </main>


    <footer>
        Suporte Tech 2026
    </footer>
</body>
</html>
